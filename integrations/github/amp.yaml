specVersion: 1.0.0
integrations:
  - name: githubIntegration # If you rename this, you need to update the integration name in src/App.tsx.
    displayName: GitHub Integration
    provider: github
    # Define the objects you want to read.
    # See https://docs.withampersand.com/read-actions for more information.
    read:
      objects:
        - objectName: gists
          destination: defaultWebhook # define your webhook in Ampersand Dashboard.
          schedule: "*/10 * * * *" # Every 10 minutes.
          # These are fields that are always read for every customer.
          # You can add any field returned by GitHub's gists API, see
          # https://docs.github.com/en/rest/gists/gists#list-gists-for-the-authenticated-user
          requiredFields:
            - fieldName: id
            - fieldName: description
            - fieldName: public
            - fieldName: html_url
            - fieldName: files
          # Add `optionalFieldsAuto` to allow customers to pick any of their gist fields,
          # Alternatively you can include a pre-chosen list in `optionalFields`.
          optionalFieldsAuto: all
          backfill:
            defaultPeriod:
              fullHistory: true

    # Define the objects you want to write to.
    # See https://docs.withampersand.com/write-actions for more information.
    write:
      objects:
        - objectName: gists

    # Proxy actions let you call any GitHub API endpoint through Ampersand.
    # See https://docs.withampersand.com/proxy-actions for more information.
    proxy:
      enabled: true
